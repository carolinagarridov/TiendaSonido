<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sonido Vivo</title>
    <link rel="stylesheet" href="CSSTienda.css">
</head>
<body>
    <header class="main-header">
        <h1>Administración Sonido Vivo</h1>
        <a href="TiendaSonido.html" style="color:#fff;">Volver a la Tienda</a>
    </header>

    <main style="max-width: 1000px; margin: 20px auto; padding: 0 15px;">
        <!-- FORMULARIO PARA AGREGAR PRODUCTOS -->
        <section class="form-container" style="max-width: 100%; margin-bottom: 30px;">
            <h2>Agregar Nuevo Producto</h2>
            <form id="form-agregar-producto" onsubmit="agregarProductoAdmin(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div class="form-group">
                        <label for="codigo">Código:</label>
                        <input type="text" id="codigo" placeholder="Ej: GA006" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="Nombre del producto" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="Guitarras Acústicas">Guitarras Acústicas</option>
                            <option value="Guitarras Eléctricas">Guitarras Eléctricas</option>
                            <option value="Bajos Eléctricos">Bajos Eléctricos</option>
                            <option value="Baterías">Baterías</option>
                            <option value="Teclados y Pianos">Teclados y Pianos</option>
                            <option value="Amplificadores">Amplificadores</option>
                            <option value="Micrófonos">Micrófonos</option>
                            <option value="Pedales de Efectos">Pedales de Efectos</option>
                            <option value="Accesorios">Accesorios</option>
                            <option value="Estudio y Grabación">Estudio y Grabación</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="marca">Marca:</label>
                        <input type="text" id="marca" required>
                    </div>
                    <div class="form-group">
                        <label for="modelo">Modelo:</label>
                        <input type="text" id="modelo" required>
                    </div>
                    <div class="form-group">
                        <label for="precio">Precio (CLP):</label>
                        <input type="number" id="precio" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock:</label>
                        <input type="number" id="stock" min="0" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label for="descripcion">Descripción Breve:</label>
                    <input type="text" id="descripcion" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Guardar Producto</button>
            </form>
        </section>

        <!-- TABLA DE PRODUCTOS -->
        <h2>Gestión de Productos</h2>
        <table border="1" cellpadding="8" style="width:100%; border-collapse:collapse; background:#fff; margin-top:15px; text-align: left;">
            <thead>
                <tr style="background:#007bff; color: white;">
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-admin-productos"></tbody>
        </table>
    </main>

    <script src="JSTienda.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarTablaAdmin();
        });

        // Cargar productos en la tabla de administración
        function cargarTablaAdmin() {
            const tbody = document.getElementById("tabla-admin-productos");
            const productos = JSON.parse(localStorage.getItem("db_productos")) || [];
            tbody.innerHTML = "";

            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay productos cargados.</td></tr>`;
                return;
            }

            productos.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${p.codigo}</strong></td>
                        <td>${p.nombre}</td>
                        <td>${p.categoria}</td>
                        <td>$${p.precio.toLocaleString('es-CL')}</td>
                        <td>${p.stock}</td>
                        <td>
                            <button onclick="eliminarProductoAdmin('${p.codigo}')" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Función para agregar un nuevo producto
        function agregarProductoAdmin(e) {
            e.preventDefault();

            const codigo = document.getElementById("codigo").value.trim().toUpperCase();
            const nombre = document.getElementById("nombre").value.trim();
            const categoria = document.getElementById("categoria").value;
            const marca = document.getElementById("marca").value.trim();
            const modelo = document.getElementById("modelo").value.trim();
            const precio = parseInt(document.getElementById("precio").value);
            const stock = parseInt(document.getElementById("stock").value);
            const descripcion = document.getElementById("descripcion").value.trim();

            let productos = JSON.parse(localStorage.getItem("db_productos")) || [];

            // Validar que el código no exista
            if (productos.some(p => p.codigo === codigo)) {
                alert("El código ingresado ya existe. Utiliza uno diferente.");
                return;
            }

            const nuevoProducto = { codigo, categoria, nombre, marca, modelo, stock, precio, descripcion };

            productos.push(nuevoProducto);
            localStorage.setItem("db_productos", JSON.stringify(productos));

            alert(`Producto "${nombre}" agregado con éxito.`);
            document.getElementById("form-agregar-producto").reset();
            cargarTablaAdmin();
        }

        // Función para eliminar un producto
        function eliminarProductoAdmin(codigo) {
            if (confirm(`¿Estás seguro de que deseas eliminar el producto con código ${codigo}?`)) {
                let productos = JSON.parse(localStorage.getItem("db_productos")) || [];
                productos = productos.filter(p => p.codigo !== codigo);

                localStorage.setItem("db_productos", JSON.stringify(productos));
                cargarTablaAdmin();
            }
        }
    </script>
</body>
</html>
