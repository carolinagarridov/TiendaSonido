# ============================================================
# TiendaSonido - perfil por defecto (H2 en memoria)
# Para MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ============================================================
spring.application.name=TiendaSonido
server.port=8080

# H2 (en memoria; se siembra el catalogo al iniciar)
spring.datasource.url=jdbc:h2:mem:tiendasonido;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (sobrescribir con la variable de entorno JWT_SECRET en produccion)
security.jwt.secret=${JWT_SECRET:c2VjcmV0LWRlLXRpZW5kYS1zb25pZG92aXZvLWNsYXZlLWRlLWxvbmctbWludW1vLTMydA==}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - frontend React (rayenn) en Vite
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JSON: Boot 4 usa Jackson 3; las fechas se serializan como ISO-8601 (ver PedidoResponse).
