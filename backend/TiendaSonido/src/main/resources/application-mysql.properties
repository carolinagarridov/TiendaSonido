# ============================================================
# Perfil MySQL (activar con: -Dspring-boot.run.profiles=mysql)
# Variables: MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD
# ============================================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/tiendasonido?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
